- aid: iab-tech-lab:agentic-advertising-api
  name: IAB Agentic Advertising API
  description: The canonical wire protocol between IAB Tech Lab's buyer and seller agents, published from the iab-agentic-primitives
    repository as an OpenAPI 3.1 document (catalog, quote-to-book deal flow, negotiation, change requests, A2A JSON-RPC
    messaging and Agent Card discovery) plus sixteen JSON Schema primitives (Account, Agent, Deal, Line, MediaKit,
    Negotiation, Order, Product, Proposal and others). Pre-release (0.1.0 / v0.5.1 tag) ahead of a 1.0 IAB Tech
    Lab standardization.
  humanURL: https://github.com/IABTechLab/iab-agentic-primitives
  x-base-url-note: No hosted base URL; the spec declares no servers[] and is implemented by each seller agent.
  tags:
  - Agentic Advertising
  - Deals
