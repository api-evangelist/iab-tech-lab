apis:
- aid: iab-tech-lab:openrtb
  name: OpenRTB 2.x Protocol
  description: >-
    OpenRTB is the real-time bidding protocol between ad exchanges and bidders. IAB Tech Lab publishes
    the 2.x specification (current release 2.6-202606) with a Protocol Buffers definition (package com.iabtechlab.openrtb.v2,
    69 messages) that is maintained in lockstep with the specification and is the standard binary encoding
    for OpenRTB.
  humanURL: https://iabtechlab.com/standards/openrtb/
  x-base-url-note: >-
    A protocol, not a hosted endpoint — every exchange and bidder pair runs its own OpenRTB bid request/response
    exchange.
  tags:
  - Real-Time Bidding
  - Programmatic
  - Protocol Buffers
  properties:
  - type: Documentation
    url: https://github.com/InteractiveAdvertisingBureau/openrtb2.x
  - type: Protobuf
    url: grpc/iab-tech-lab-openrtb-v2.proto
  - type: ChangeLog
    url: https://github.com/InteractiveAdvertisingBureau/openrtb2.x/releases
  - type: Protobuf
    url: grpc/iab-tech-lab-grpc-index.yml
- aid: iab-tech-lab:adcom
  name: AdCOM Protobuf
  description: >-
    Advertising Common Object Model (AdCOM) 1.0 is the shared object layer beneath OpenRTB 3.0, OpenDirect
    and the Ad Management API — media (ads, assets), placement, context (site, app, user, device, geo)
    and the standard enumerations. Published as five Protocol Buffers files under package com.iabtechlab.adcom.v1
    in the IABTechLab/adcom-proto repository.
  humanURL: https://github.com/IABTechLab/adcom-proto
  x-base-url-note: A data model, not a hosted endpoint.
  tags:
  - Data Model
  - Protocol Buffers
  properties:
  - type: Documentation
    url: https://github.com/InteractiveAdvertisingBureau/AdCOM
  - type: Protobuf
    url: grpc/adcom/iab-tech-lab-adcom-adcom.proto
  - type: Protobuf
    url: grpc/adcom/iab-tech-lab-adcom-media.proto
  - type: Protobuf
    url: grpc/adcom/iab-tech-lab-adcom-placement.proto
  - type: Protobuf
