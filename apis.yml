aid: iab-tech-lab
name: IAB Tech Lab
description: 'IAB Technology Laboratory (IAB Tech Lab) is the non-profit consortium that writes the technical standards
  the digital advertising supply chain runs on — OpenRTB (real-time bidding), AdCOM, OpenDirect (programmatic direct),
  VAST and VMAP (video ad serving), the Transparency and Consent Framework and Global Privacy Platform (consent
  signals), ads.txt, app-ads.txt and sellers.json (supply-chain transparency), the Open Measurement SDK and the
  content/audience/ad-product taxonomies. Its machine-readable contracts are published in the open on GitHub: an
  OpenRTB 2.x Protocol Buffers definition, the AdCOM protobuf, an OpenDirect Swagger specification, VAST XSDs, and
  an agentic-advertising stack (buyer-agent, seller-agent, Deals API, Agentic RTB Framework gRPC) that ships OpenAPI
  3.1 contracts, JSON Schema primitives, MCP servers and A2A agent cards as reference implementations. The Tech
  Lab Tools Portal and its Core API sit behind a member login.'
url: https://raw.githubusercontent.com/api-evangelist/iab-tech-lab/refs/heads/main/apis.yml
