- aid: iab-tech-lab:agentic-rtb-framework
  name: Agentic RTB Framework gRPC
  description: >-
    The Agentic Real-Time Framework (ARTF) 1.0 defines gRPC extension points an exchange calls during
    an auction so that agents can mutate the bidstream. The RTBExtensionPoint service (package com.iabtechlab.bidstream.mutation.services.v1)
    exposes a GetMutations RPC over OpenRTB 2.6 messages; the reference implementation also exposes the
    same service as an MCP "Extend RTB" tool over Streamable HTTP. Published as proto3 files with a Rust
    reference implementation.
  humanURL: https://github.com/IABTechLab/agentic-real-time-framework
  x-base-url-note: Self-hosted gRPC (reference implementation listens on :50051); no hosted endpoint.
  tags:
  - Real-Time Bidding
  - gRPC
  - Agentic Advertising
  properties:
  - type: Documentation
    url: >-
      https://github.com/IABTechLab/agentic-real-time-framework/blob/main/Agentic_Real_Time_Framework_Version_1_0_FINAL.md
  - type: Protobuf
    url: grpc/agentic-rtb-framework/iab-tech-lab-agenticrtbframeworkservices.proto
  - type: Protobuf
    url: grpc/agentic-rtb-framework/iab-tech-lab-agenticrtbframework.proto
- aid: iab-tech-lab:vast
  name: VAST and VMAP Schemas
  description: >-
    Video Ad Serving Template (VAST) is the XML contract between video players and ad servers; VMAP (Video
    Multiple Ad Playlist) schedules ad breaks around content. IAB Tech Lab publishes XML Schema definitions
    for VAST 4.1, 4.2 and 4.4 and VMAP 1.0 in its GitHub repositories (the vast_4.3.xsd file in the repository
    is empty upstream).
  humanURL: https://iabtechlab.com/standards/vast/
  x-base-url-note: An XML document format exchanged between players and ad servers, not a hosted endpoint.
  tags:
  - Video Ads
  - XML
  properties:
  - type: Documentation
    url: https://github.com/InteractiveAdvertisingBureau/VAST
  - type: XMLSchema
    url: xsd/iab-tech-lab-vast-4.4.xsd
  - type: XMLSchema
    url: xsd/iab-tech-lab-vast-4.2.xsd
  - type: XMLSchema
    url: xsd/iab-tech-lab-vast-4.1.xsd
  - type: XMLSchema
    url: xsd/iab-tech-lab-vmap-1.0.xsd
- aid: iab-tech-lab:supply-chain-api
  name: Supply Chain API
  description: >-
    IAB Tech Lab's hosted, subscription API for aggregated supply-chain data: crawled and validated ads.txt,
    app-ads.txt and sellers.json files, plus the Transparency Center's compliance and identifier registries
    (OM SDK and podcast compliance, MSPA signatory IDs, SKAdNetwork IDs, GPP data). Access is provisioned
    through the Tech Lab Tools Portal (tools.iabtechlab.com, free login) at /transparencycenter/apiAccess/all;
    the backing host api.iabtechlab.com (alias coreapi.iabtechlab.com) identifies itself as 'IAB Tech
    Lab Core API' and answers /health, but /docs, /docs/oauth and /openapi.json all 302 to /login, so
    the contract is gated behind a subscription. Basic tier is $2,500/yr for members and $4,500/yr for
    non-members; API+ adds $2,500/yr.
  humanURL: https://iabtechlab.com/software/iab-tech-lab-supply-chain-api/
  baseURL: https://api.iabtechlab.com
  tags:
  - Supply Chain
  - ads.txt
  - sellers.json
  - Transparency
  - Compliance
  properties:
  - type: Documentation
    url: https://iabtechlab.com/software/transparency-center/
  - type: Pricing
    url: https://iabtechlab.com/software/iab-tech-lab-supply-chain-api/
  - type: SignUp
    url: https://tools.iabtechlab.com/
  - type: Portal
    url: https://tools.iabtechlab.com/
  - type: Plans
    url: plans/iab-tech-lab-plans-pricing.yml
  x-base-url-note: >-
    api.iabtechlab.com is the host the Tools Portal SDK (iabtechlab-sdk_v1.7.3.js) calls and the one that
    names itself IAB Tech Lab Core API; coreapi.iabtechlab.com serves the identical page. The contract
    behind /docs is gated (302 -> /login).
