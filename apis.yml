- aid: iab-tech-lab:buyer-agent-api
  name: Buyer Agent API
  description: 'IAB Tech Lab''s reference buyer agent for DSPs, agencies and advertisers: an OpenAPI 3.1 REST surface
    (14 operations — orders and audit trails, booking jobs and approvals, product search, events, reports and campaign
    metadata) that drives MCP, A2A and REST clients against seller agents to browse media kits, negotiate and book
    OpenDirect 2.1 deals. Self-hosted; no IAB Tech Lab-hosted instance.'
  humanURL: https://iabtechlab.github.io/buyer-agent/
  x-base-url-note: Self-hosted; the spec declares no servers[]. No IAB Tech Lab-hosted instance was found.
