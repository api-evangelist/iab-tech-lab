- aid: iab-tech-lab:seller-agent-api
  name: Seller Agent API
  description: 'IAB Tech Lab''s reference seller agent for publishers: an OpenAPI 3.1 REST surface (87 operations
    — products and avails, tiered pricing, quotes, deal booking, negotiation, change requests, orders, packages,
    curators, SSP distribution, GAM/FreeWheel inventory sync, operator API keys), an MCP server with 46 tools at
    /mcp/ (Streamable HTTP) or stdio, and an A2A agent card at /.well-known/agent.json. Self-hosted by each publisher;
    IAB Tech Lab publishes the code and docs, not a hosted instance.'
  humanURL: https://iabtechlab.github.io/seller-agent/
  x-base-url-note: Self-hosted (uvicorn on the publisher's own host); docs use http://localhost:8000 and https://your-server.example.com
    as placeholders. No IAB Tech Lab-hosted instance was found.
  tags:
