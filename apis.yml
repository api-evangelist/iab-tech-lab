apis:
- aid: iab-tech-lab:opendirect-api
  name: OpenDirect API
  description: 'OpenDirect is IAB Tech Lab''s standard REST API for programmatic direct (guaranteed) media buying:
    organizations, accounts, products, orders, lines, creatives, assignments, change requests and messages exchanged
    between buyer and seller systems. The 1.5.1 Swagger 2.0 contract is published verbatim; OpenDirect 2.1 is published
    as prose plus an MCP tool catalog (33 tools) in the mcp-config reference implementation. There is no IAB Tech
    Lab-hosted instance — every seller hosts its own endpoint, which is why the contract''s host is a placeholder.'
  humanURL: https://iabtechlab.com/standards/opendirect/
  x-base-url-note: No hosted base URL. The specification names host opendirect.example.com (1.5.1) and https://opendirect.example.com/v2.1
    (2.1) as placeholders; each implementing seller publishes its own.
  tags:
  - Programmatic Direct
  - Media Buying
  - Orders
  properties:
  - type: Documentation
    url: https://github.com/InteractiveAdvertisingBureau/OpenDirect
  - type: OpenAPI
    url: openapi/iab-tech-lab-opendirect-1-5-1-swagger.yaml
