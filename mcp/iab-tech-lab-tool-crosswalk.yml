  is self-hosted so tools/list was not probed live; bindings are by name and documented semantics with confidence
  per row.
purpose: Bind each seller-agent MCP tool to the REST operationId(s) that back it so the tool inherits that operation's
  parameters and requestBody as its real inputSchema. Ten tools are MCP-only (operator configuration and composites)
  and the REST surface carries many operator/admin operations with no tool.
