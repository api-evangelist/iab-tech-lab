generated: '2026-09-17'
method: searched
status: published
source: https://iabtechlab.github.io/seller-agent/api/mcp/ (transport + auth), https://iabtechlab.github.io/seller-agent/reference/mcp-tools/
  (46 tools), https://github.com/InteractiveAdvertisingBureau/mcp-config (OpenDirect MCP schema with published inputSchemas),
  https://github.com/IABTechLab/agentic-real-time-framework/blob/main/docs/01-MCP.md
description: 'IAB Tech Lab publishes three MCP servers, all as open-source reference implementations that an operator
  runs on their own host — none is hosted by IAB Tech Lab, so no agent can reach them without a human deploying
  one first. (1) seller-agent: the primary interface of the publisher-side agent, 46 tools over Streamable HTTP
  at /mcp/ (protocol 2025-06-18) or local stdio, legacy HTTP+SSE at /mcp-sse/sse. (2) mcp-config: OpenDirect v2.1
  MCP with 33 schema-generated CRUD tools whose inputSchemas are published verbatim in opendirect-mcp-schema.json
  (saved here as iab-tech-lab-opendirect-mcp-tools.json), served over SSE at localhost:3000/schema/mcp/sse. (3)
  agentic-real-time-framework: the RTBExtensionPoint gRPC service re-exposed as one MCP tool, "Extend RTB", on :50052
  (Streamable HTTP).'
deployment:
  mode: local-stdio
  endpoint: null
  install: git clone https://github.com/IABTechLab/seller-agent && cd seller-agent && uv sync --locked && uv run
    uvicorn ad_seller.interfaces.api.main:app --port 8000
  package: https://github.com/IABTechLab/seller-agent
  auth: api-key
  verified: searched
  note: 'Self-hosted. The seller-agent MCP is reached at http://localhost:8000/mcp/ (Streamable HTTP, trailing slash
    required) or over stdio once the operator runs it; the docs use https://your-server.example.com/mcp/ as the
    placeholder for a deployed instance. Operator API key (Authorization: Bearer or X-Api-Key) gates admin tools
    over HTTP; stdio is trusted like the CLI. No IAB Tech Lab-hosted endpoint exists, so mode is local: a human
    must install and run it before any agent sees it.'
servers:
- name: seller-agent
  repository: https://github.com/IABTechLab/seller-agent
  docs: https://iabtechlab.github.io/seller-agent/api/mcp/
  transport:
  - streamable-http (/mcp/, protocol 2025-06-18)
  - stdio
  - http+sse (/mcp-sse/sse, protocol 2024-11-05, deprecated)
  protocol_version: '2025-06-18'
  tool_count: 46
  auth: operator API key over HTTP (Bearer or X-Api-Key); anonymous = public tier; stdio trusted
  clients_documented:
  - Claude Desktop/Web
  - ChatGPT
  - Codex
  - Cursor
  version: v2.4.2 (2026-08-18)
- name: opendirect-mcp-server
  repository: https://github.com/InteractiveAdvertisingBureau/mcp-config
  transport:
  - http+sse (localhost:3000/schema/mcp/sse, /agenticdirect/mcp/sse, /mcp/sse)
  tool_count: 33
  schema_file: mcp/iab-tech-lab-opendirect-mcp-tools.json
  spec: OpenDirect v2.1 Final
  version: 2.1.0
  auth: none documented (local)
  note: Also 10 hand-written OpenDirect tools and 8 API-testing tools per the README; only the 33 schema-driven
    tools have published inputSchemas.
- name: agentic-rtb-framework
  repository: https://github.com/IABTechLab/agentic-real-time-framework
  docs: https://github.com/IABTechLab/agentic-real-time-framework/blob/main/docs/01-MCP.md
  transport:
  - streamable-http (:50052)
  tool_count: 1
  tools:
  - Extend RTB (RTBExtensionPoint.GetMutations)
  auth: OAuth supported per MCP 2025-06-18 (per docs); not probed
