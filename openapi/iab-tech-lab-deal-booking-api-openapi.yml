      - pricing
      - terms
      title: Deal
      description: 'A confirmed deal booked from a quote (Deals API v1.0 book phase).


        ID minting: ``deal_id`` is seller-issued.'
    DealBookingRequest:
      properties:
        idempotency_key:
          type: string
          minLength: 1
          title: Idempotency Key
          description: Requester-minted opaque key (UUID recommended). Same key -> same response, no duplicate side effects (FD-12). Reusing a key with a different body is an idempotency_conflict error.
        quote_id:
          type: string
          title: Quote Id
          description: Seller-issued quote being booked.
        buyer_identity:
          anyOf:
          - $ref: '#/components/schemas/BuyerIdentity'
          - type: 'null'
          description: Must be consistent with the identity the quote was priced for; the seller re-verifies tier at booking.
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
        audience_plan:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Audience Plan
          description: Audience plan frozen with the booking (open object; typed model lands with the audience-plan bead). Unsupported parts are rejected structurally (FD-6) so the buyer can degrade and retry.
        consent_context:
          anyOf:
          - $ref: '#/components/schemas/ConsentContext'
          - type: 'null'
          description: Privacy consent signals riding with the booking (FD-10).
      type: object
      required:
      - idempotency_key
      - quote_id
      title: DealBookingRequest
      description: 'Request body for ``POST /api/v1/deals`` (money-mutating: FD-12).


        This is the commit point — the referenced quote becomes bound. The

        seller mints ``deal_id`` in the response.'
    PricingModel:
      type: string
      enum:
      - cpm
      - cpmv
      - cpv
      - cpc
      - cpcv
      - cpd
      - cpp
      - flat_fee
      - unit_rate
      - hybrid
      title: PricingModel
      description: 'Unit of pricing. Union of the buyer''s ``RateType`` and the seller''s

        ``PricingModel`` plus the linear TV additions.


        - ``cpm``: cost per mille (thousand impressions)

        - ``cpmv``: cost per thousand viewable impressions

        - ``cpv``: cost per view

        - ``cpc``: cost per click

        - ``cpcv``: cost per completed view

        - ``cpd``: cost per day

        - ``cpp``: cost per (gross rating) point — linear TV

        - ``flat_fee``: flat fee (buyer repo''s ``FlatRate`` maps here)

        - ``unit_rate``: per-unit rate

        - ``hybrid``: mixed CPM/CPP pricing — linear TV'
