openapi: 3.2.0
info:
  title: Iab Tech Lab Products API
  version: '1.0'
  description: 'Operations tagged Products across 4 of this provider''s published API definitions: iab-tech-lab-agentic-advertising-api-openapi.yaml, iab-tech-lab-buyer-agent-openapi.json, iab-tech-lab-opendirect-1-5-1-swagger.yaml, iab-tech-lab-seller-agent-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://opendirect.example.com/v1.5.1
tags:
- name: Products
paths:
  /products:
    get:
      operationId: listProducts
      summary: Paginated product catalog (filtering is client-side; no /products/search)
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Page of products with pagination echo.
          content:
            application/json:
              schema:
                $ref: ../jsonschema/protocol/ProductListResponse.json
      tags:
      - Products
  /products/{product_id}:
    get:
      operationId: getProduct
      summary: Product detail (the Product primitive, no wrapper)
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The product.
          content:
            application/json:
              schema:
                $ref: ../jsonschema/Product.json
        '404':
          $ref: '#/components/responses/Error'
      tags:
      - Products
  /products/avails:
    post:
      operationId: checkAvails
      summary: Availability + pricing query (OpenDirect 2.1 spec dialect and legacy simplified…
      description: 'Honest-availability check, served in BOTH dialects. Servers accept the published OpenDirect 2.1 ProductAvailsSearch (multi-product productids array with required accountid/advertiserbrandid) AND the legacy single-product simplified profile, discriminated by productids (array, spec) vs productid (scalar, legacy). The response dialect follows the request dialect — spec requests get the spec ''avails'' collection envelope of Avails records (per the OpenDirect Collection Objects table) with availsstatus semantics (Available / Partially Available / Unavailable, enumerated reasons); legacy requests get the legacy single-object response unchanged, so v2.1.0-v2.2.1 payload round-trips are preserved. Legacy policy (unchanged): availableImpressions is REQUIRED (uncapped products report the requested volume as available). deliveryConfidence is OPTIONAL and OMITTED entirely when the seller has no forecast data source — emitters MUST NOT fabricate a value or pad with null (readers tolerate null from pre-contract emitters). guaranteedImpressions is present ONLY for PG-capable (Programmatic Guaranteed) products. Money fields on this surface are floats — a documented FD-11 exception preserving the shipped OpenDirect 2.1 wire dialect; migration to Money micros is reserved for the next major version.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: ../jsonschema/protocol/ProductAvailsSearch.json
              - $ref: ../jsonschema/protocol/AvailsRequest.json
      responses:
        '200':
          description: 'Availability and pricing derived from catalog data. Spec requests: the ''avails'' collection envelope (one Avails record per requested product). Legacy requests: the legacy single-object response.'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: ../jsonschema/protocol/AvailsCollection.json
                - $ref: ../jsonschema/protocol/AvailsResponse.json
        '404':
          $ref: '#/components/responses/Error'
        '422':
          description: Unpriceable product (neither base nor floor CPM) or request validation failure — never a fabricated price.
          content:
            application/json:
              schema:
                $ref: ../jsonschema/protocol/ErrorEnvelope.json
      tags:
      - Products
  /products/search:
    post:
      tags:
      - Products
      summary: Search Products
      description: Search available advertising products.
      operationId: search_products_products_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductSearchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Search Products Products Search Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /products/{productId}:
    get:
      tags:
      - Products
      description: 'Gets the specified product from the publisher’s product catalog.

        Only the buyers/advertisers who have obtained an Organization ID and Buyer ID/Advertiser ID from the publisher shall issue this request. The ID issued should be a valid product id previously retrieved from the publisher, for example, with /products. Invalid IDs should return an error (define error code/message).'
      parameters:
      - $ref: '#/components/parameters/productId'
      responses:
        200:
          $ref: '#/components/responses/ProductResponse'
        401:
          $ref: '#/components/responses/Standard401ErrorResponse'
        404:
          $ref: '#/components/responses/Standard404ErrorResponse'
        500:
          $ref: '#/components/responses/Standard500ErrorResponse'
      security:
      - OauthSecurity:
        - https://opendirect.example.com/scope/example
      summary: Get products by product id
      x-summary-source: derived
      operationId: getProductsByProductId
      x-operation-id-source: derived
    servers:
    - url: https://opendirect.example.com/v1.5.1
  /api/v1/products/{product_id}/inventory-type:
    post:
      tags:
      - Products
      summary: Override Inventory Type
      description: 'Override the auto-detected inventory type for a product.


        Publishers can correct misclassified inventory types from ad server sync

        or apply custom categorization. The override persists across future syncs.'
      operationId: override_inventory_type_api_v1_products__product_id__inventory_type_post
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: string
          title: Product Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: X-Api-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryTypeOverride'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Products
      summary: Get Inventory Type Override
      description: Get the current inventory type override for a product, if any.
      operationId: get_inventory_type_override_api_v1_products__product_id__inventory_type_get
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: string
          title: Product Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Products
      summary: Delete Inventory Type Override
      description: Remove an inventory type override, reverting to auto-detected type.
      operationId: delete_inventory_type_override_api_v1_products__product_id__inventory_type_delete
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: string
          title: Product Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  responses:
    Error:
      description: 'Structured error envelope: {"detail": {"error": <ErrorCode>, "message": "...", "unsupported": [...]}}.'
      content:
        application/json:
          schema:
            $ref: ../jsonschema/protocol/ErrorEnvelope.json
    Standard500ErrorResponse:
      description: Unexpected error occurred
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
          example: "{\n  \"ErrorCode\": \"internalError\",\n  \"ErrorMessage\": \"Unexpected error occurred\"\n}\n"
    Standard400ErrorResponse:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
          example: "{\n  \"ErrorCode\": \"badRequest\",\n  \"ErrorMessage\": \"Request contains invalid data\"\n}\n"
    ProductResponse:
      description: Product resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Product'
          example: "{\n  \"AdFormatTypes\": [\n    \"Flash\",\n    \"Tag\",\n    \"Image\"\n  ],\n  \"BasePrice\": 1.31,\n  \"Currency\": \"USD\",\n  \"DeliveryType\": \"Guaranteed\",\n  \"Descripion\": \"A description of the product for display purposes\",\n  \"Domain\": \"mydomain.com\",\n  \"EstimatedDailyAvails\": \"Hundreds of Thousands\",\n  \"Geometry\": [\n    {\n      \"Height\": 160\n      \"Width\": 600\n    }\n  ],\n  \"HttpsCompatible\": False,\n  \"Icon\": \"http://<domain>/<path>/icon.jpg\",\n  \"Id\": \"456366\",\n  \"InventoryType\": {\n    \"Name\": \"Desktop\",\n    \"Name\": \"Tablet\"\n  },\n  \"Languages\": [\n    \"EN\"\n  ],\n  \"Name\": \"Unique Product Name\",\n  \"MaturityLevel\": {\n    \"Level\": \"Over12\"\n  },\n  \"MaxDuration\": 30,\n  \"MinDuration\": 1,\n  \"MinSpend\": 30.00,\n  \"Position\": \"AboveFold\",\n  \"ProductTags\": \"Foo Bar Zoo\",\n  \"RateType\": \"CPM\",\n  \"TargetTypes\": [\n    \"2342\",\n    \"3355\"\n  ],\n  \"TimeZone\": \"Eastern Standard Time\"\n  \"Url\": \"http://<domain>/<path>/creativespec.aspx\"\n}\n"
    Standard404ErrorResponse:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
          example: "{\n  \"ErrorCode\": \"notFound\",\n  \"ErrorMessage\": \"Requested resource is not found\"\n}\n"
    Standard401ErrorResponse:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Errors'
          example: "{\n  \"ErrorCode\": \"unauthorized\",\n  \"ErrorMessage\": \"You are not authorized to use this service\"\n}\n"
    ProductsResponse:
      description: Collection of Product
      headers:
        X-Total-Count:
          description: Total number of results
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Products'
          example: "{\n  \"Products\": [\n    {\n      \"AdFormatTypes\": [\n        \"Flash\",\n        \"Tag\",\n        \"Image\"\n      ],\n      \"BasePrice\": 1.31,\n      \"Currency\": \"USD\",\n      \"DeliveryType\": \"Guaranteed\",\n      \"Descripion\": \"A description of the product for display purposes\",\n      \"Domain\": \"mydomain.com\",\n      \"EstimatedDailyAvails\": \"Hundreds of Thousands\",\n      \"Geometry\": [\n        {\n          \"Height\": 160\n          \"Width\": 600\n        }\n      ],\n      \"HttpsCompatible\": False,\n      \"Icon\": \"http://<domain>/<path>/icon.jpg\",\n      \"Id\": \"456366\",\n      \"InventoryType\": {\n        \"Name\": \"Desktop\",\n        \"Name\": \"Tablet\"\n      },\n      \"Languages\": [\n        \"EN\"\n      ],\n      \"Name\": \"Unique Product Name\",\n      \"MaturityLevel\": {\n        \"Level\": \"Over12\"\n      },\n      \"MaxDuration\": 30,\n      \"MinDuration\": 1,\n      \"MinSpend\": 30.00,\n      \"Position\": \"AboveFold\",\n      \"ProductTags\": \"Foo Bar Zoo\",\n      \"RateType\": \"CPM\",\n      \"TargetTypes\": [\n        \"2342\",\n        \"3355\"\n      ],\n      \"TimeZone\": \"Eastern Standard Time\"\n      \"Url\": \"http://<domain>/<path>/creativespec.aspx\"\n    }\n  ]\n}\n"
    ProductAvailsResponse:
      description: Collection of ProductAvails
      headers:
        X-Total-Count:
          description: Total number of results
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Avails'
          example: "{\n  \"Avails\": [\n    {\n      \"Availability\": 21543,\n      \"Currency\": \"USD\",\n      \"ProductId\": \"456366\",\n      \"Price\": 1.26\n    }\n  ]\n}\n"
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ProductSearchRequest:
      properties:
        channel:
          anyOf:
          - type: string
          - type: 'null'
          title: Channel
        format:
          anyOf:
          - type: string
          - type: 'null'
          title: Format
        min_price:
          anyOf:
          - type: number
          - type: 'null'
          title: Min Price
        max_price:
          anyOf:
          - type: number
          - type: 'null'
          title: Max Price
        limit:
          type: integer
          maximum: 50.0
          minimum: 1.0
          title: Limit
          default: 10
      type: object
      title: ProductSearchRequest
      description: Request to search products.
    Errors:
      type: array
      items:
        $ref: '#/components/schemas/Error'
    Segment:
      description: The segment object is made up of TARGET and TARGET VALUE reference data objects and is used to specify targeting options for a LINE resource
      required:
      - Target
      - TargetValues
      properties:
        Target:
          $ref: '#/components/schemas/Target'
        TargetValues:
          description: A list of target values. For example, age range 18-24 and 25-34.
          type: array
          items:
            $ref: '#/components/schemas/TargetValue'
    InventoryType:
      description: Defines a list of devices that the product may serve on.
      allOf:
      - $ref: '#/components/schemas/Identity'
      - required:
        - Name
        properties:
          Name:
            description: The ad format’s display name.
            type: string
            enum:
            - App
            - Desktop
            - Mobile
            - Tablet
    FrequencyCapInterval:
      description: 'Defines the frequency cap intervals that the API supports.

        The frequency interval specifies the units in which the frequency count is expressed. For example, if a line’s frequency count is 2 and interval is Day, display the ad to the same user a Max 2 times in the same calendar day.

        '
      allOf:
      - $ref: '#/components/schemas/Identity'
      - required:
        - Name
        properties:
          Name:
            description: The name of the interval.
            type: string
            enum:
            - Day
            - Month
            - Week
            - Hour
            - LineDuration
    AdFormatType:
      description: Defines the possible ad formats.
      allOf:
      - $ref: '#/components/schemas/Identity'
      - required:
        - Name
        properties:
          Name:
            description: The ad format’s display name.
            type: string
            enum:
            - HTML5
            - HTML5Expandable
            - Flash
            - FlashExpandable
            - Image
            - Tag
            - TagExpandable
            - Text
            - Video
            - VPAID
            - MRAID
    ProductAvails:
      description: The ProductAvails object returns product availability and pricing information.
      required:
      - Availability
      - Currency
      - ProductId
      - Price
      properties:
        Availability:
          description: 'The quantity available for booking for the specified date range. Availability for a given date range may vary.

            In order for products to be returned in a PRODUCT AVAILS SEARCH, product availability must be equal to or less than the value provided in the Quantity property of the PRODUCT AVAILS SEARCH object.

            For example, if Quantity is set to 500,000 in PRODUCT AVAILS SEARCH, impression availability for the product must be at least 500,000. However, if only 250,000 impressions are available, the product is not returned.

            Publishers may set an artificial limit on the maximum number of available impressions. If the quantity field in PRODUCT AVAILS SEARCH is not provided, all products matching other criteria are returned showing maximum availability.

            '
          type: integer
        Currency:
          description: The currency used to specify Price. Currency is set for the PRODUCT resource.
          $ref: '#/components/schemas/Currency'
        ProductId:
          description: Each ID returned matches one of the product IDs provided in the ProductId property of the PRODUCT AVAILS SEARCH object.
          type: string
        Price:
          description: The product’s price per unit as defined using RATE TYPE reference data. The product’s rate type determines the unit. For example, if RateType is CPM, the price is per 1,000 impressions.
          type: number
    Size:
      description: The Size object defines the height and width (in pixels) that a publisher accepts. The size object populates publisher-accepted sizes in the GEOMETRY property of relevant resources, such as CREATIVE.
      required:
      - Height
      - Width
      properties:
        Height:
          description: The height of accepted creative size in pixels.
          type: integer
        Width:
          description: The width of accepted creative size in pixels.
          type: integer
    Avails:
      required:
      - Avails
      properties:
        Avails:
          type: array
          items:
            $ref: '#/components/schemas/ProductAvails'
    AdPosition:
      description: Defines the possible ad positions on a web page.
      allOf:
      - $ref: '#/components/schemas/Identity'
      - required:
        - Name
        properties:
          Name:
            description: The ad position’s display name.
            type: string
            enum:
            - AboveFold
            - BelowFold
    RateType:
      description: Defines a unit of measure that a cost (i.e. BasePrice) is expressed in. The API may support all or a subset of the specified values.
      allOf:
      - $ref: '#/components/schemas/Identity'
      - required:
        - Name
        properties:
          Name:
            description: The rate type’s display name.
            type: string
            enum:
            - CPM
            - CPMV
            - CPC
            - CPD
            - FlatRate
    Target:
      description: Defines a target category. The API must support the specified target categories and may support additional categories such as zip code or postal code.
      allOf:
      - $ref: '#/components/schemas/Identity'
      - required:
        - Name
        properties:
          Name:
            description: The target category.
            type: string
            enum:
            - Age
            - Gender
            - DMA
            - Country
            - State/Province
            - Daypart
            - Weekpart
            - Behavioral
            - Device
    TargetValue:
      description: 'Defines a target value.

        The API must support the specified values per target category.

        '
      allOf:
      - $ref: '#/components/schemas/Identity'
      - required:
        - Value
        - TargetId
        properties:
          Value:
            description: The target value
            type: string
            enum:
            - Age - Publisher-defined age ranges
            - Gender - Female
            - Gender - Male
            - DMA - Publisher-defined  source (such as Digital Envoy)
            - Country - Publisher-defined source
            - State-Province - Publisher-defined source
            - Daypart - 0 through 23 hours
            - Weekpart - Sunday
            - Weekpart - Monday
            - Weekpart - Tuesday
            - Weekpart - Wednesday
            - Weekpart - Thursday
            - Weekpart - Friday
            - Weekpart - Saturday
          TargetId:
            description: A system-generated ID that identifies the target category that this value belongs to.
            type: string
    ProductSearch:
      description: 'The ProductSearch object is used to generate a general list of products independent of their availability. For example, an agency might be interested in looking up all products that support video ads just to get an idea for what the options are. Alternatively, the ProductAvailsSearch returns a list of products within specified search criteria.

        Product selection uses a logical AND between fields and a logical OR between field values. For example, the product is selected if it supports the Flash OR Image OR Text ad format, AND supports USD currency, AND specifies the ? tag OR bar product tag.

        At least one field must be specified.

        '
      properties:
        AdFormatTypes:
          description: One or more ad types. Return products that support one or more of the specified formats.
          type: array
          items:
            $ref: '#/components/schemas/AdFormatType'
          x-publisher-support-required: true
        Currency:
          description: The currency that the product supports. Return products that support the specified currency.
          $ref: '#/components/schemas/Currency'
          x-publisher-support-required: true
        DeliveryType:
          $ref: '#/components/schemas/DeliveryType'
          x-publisher-support-required: true
        Domain:
          description: The product’s domain.
          type: string
          x-publisher-support-required: true
        Geometry:
          description: One or more ad sizes. Return products that support one or more of the specified sizes.
          type: array
          items:
            $ref: '#/components/schemas/Size'
          x-publisher-support-required: true
        ProductTags:
          description: 'One or more tags used to label products. Returns products that have product tags that exactly match one or more of the specified tags. A match occurs if the specified tag exactly matches the product’s tag (using a case insensitive comparison).

            For example, the product is selected if the specified search tag is Travel and the product includes a Travel tag. However, if the product includes only a European Travel tag, the product is not selected.

            '
          type: array
          items:
            type: string
    Language:
      description: Defines a language that the API supports. The API may support all or a subset of the languages specified in ISO 639-1.
      required:
      - IsoCode
      properties:
        IsoCode:
          description: The language’s two-character ISO code as specified in ISO 639-1.
          type: string
          minLength: 2
          maxLength: 2
    Currency:
      description: 'Defines a currency that the API supports.

        The API may support all or a subset of the currencies specified in ISO-4217.

        '
      required:
      - IsoCode
      properties:
        IsoCode:
          description: The currency’s three-character ISO code (ISO 4217).
          type: string
          minLength: 3
          maxLength: 3
    Error:
      type: object
      required:
      - ErrorCode
      - ErrorMessage
      properties:
        ErrorCode:
          type: string
        ErrorMessage:
          type: string
        Context:
          type: object
        Link:
          type: string
    Product:
      description: A Product resource identifies anything from an ad placement to a Run of Network product in the publisher’s product catalog. Values for all supported fields are provided by the publisher.
      allOf:
      - $ref: '#/components/schemas/Identity'
      - required:
        - AdFormatTypes
        - BasePrice
        - Currency
        - Geometry
        - Name
        - RateType
        properties:
          ActiveDate:
            description: The date and time, in UTC, that the product may become part of the bookable inventory.
            type: string
            format: date-time
          AdFormatTypes:
            description: A list of ad types that the product supports.
            type: array
            items:
              $ref: '#/components/schemas/AdFormatType'
          AllowNoCreative:
            description: A Boolean value that indicates whether line items assigned to this order may be booked before creative is assigned. A value of TRUE allows lines to be booked without creative assigned. Default value is FALSE and prevents lines from being booked when no creative is assigned.
            type: boolean
          BasePrice:
            description: The product’s base retail price; this is not the rate card price. The actual price may be more if targeting is specified.
            type: number
          Currency:
            description: Identifies the currency for BasePrice and MinSpend.
            $ref: '#/components/schemas/Currency'
          DeliveryType:
            $ref: '#/components/schemas/DeliveryType'
          Description:
            description: The product’s description.
            type: string
            maxLength: 255
          Domain:
            description: The product’s domain.
            type: string
            maxLength: 255
          EstimatedDailyAvails:
            description: 'An estimated range of available daily impressions.

              The ranges should be of the form: Thousands, Tens of Thousands, Hundreds of Thousands, and so on.

              '
            type: string
          Geometry:
            description: A list of ad format sizes that the product supports.
            type: array
            items:
              $ref: '#/components/schemas/Size'
          HttpsCompatible:
            description: A Boolean value that determines whether the product supports creatives that can properly render on an HTML web page served over HTTPS.
            type: boolean
          Icon:
            description: 'URL to a thumbnail icon of the product. May be used to display next to the product in the product catalog.

              Publishers should support icons that are 150x150 or less. The maximum size is 10 KB.

              '
            type: string
          InventoryType:
            $ref: '#/components/schemas/InventoryType'
          Languages:
            description: A list of creative languages that the product supports.
            type: array
            items:
              $ref: '#/components/schemas/Language'
          LeadTime:
            description: The number of days (n) from today that a line that reference this product can begin running; the line’s start date must be equal to or later than today + n.
            type: integer
          Name:
            description: 'The product’s display name.

              The name must be unique.

              '
            type: string
            maxLength: 38
          MaturityLevel:
            $ref: '#/components/schemas/MaturityLevel'
          MaxDuration:
            description: The maximum number of days that the product may be booked for. The line must enforce the duration.
            type: integer
          MinDuration:
            description: The minimum number of days that the product must be booked for. The line must enforce the duration.
            type: integer
          MinSpend:
            description: The minimum amount of money that must be spent on this product in order to book it.
            type: number
          Position:
            $ref: '#/components/schemas/AdPosition'
          ProductTags:
            description: List of tags used for searching the product catalog.
            type: array
            items:
              type: string
              maxLength: 100
            maxItems: 500
          RateType:
            $ref: '#/components/schemas/RateType'
          RetirementDate:
            description: The date and time, in UTC, that the product may be removed from the bookable inventory.
            type: string
