  /api/v1/inventory-sync/trigger:
    post:
      tags:
      - Core
      summary: Trigger Inventory Sync
      description: 'Manually trigger an inventory sync.


        Args:

        incremental: If true, only sync items changed since last sync

        (based on stored sync watermark). Full sync if false or no

        previous watermark exists.'
      operationId: trigger_inventory_sync_api_v1_inventory_sync_trigger_post
      parameters:
      - name: incremental
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Incremental
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/inventory-sync/watermark:
    get:
      tags:
      - Core
      summary: Get Sync Watermark
      description: Get the last sync watermark (used for incremental sync).
      operationId: get_sync_watermark_api_v1_inventory_sync_watermark_get
