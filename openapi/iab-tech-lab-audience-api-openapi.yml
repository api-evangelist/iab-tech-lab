openapi: 3.2.0
info:
  title: Iab Tech Lab Audience API
  version: 1.0.0
  contact:
    name: IAB Tech Lab
    url: https://iabtechlab.com/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: 'Operations tagged Audience across 2 of this provider''s published API definitions: iab-tech-lab-seller-agent-openapi.json, iab-tech-lab-seller-agent-openapi.json. Each path carries the servers of the definition it was published in.'
tags:
- name: Audience
paths:
  /agentic-audience/match:
    post:
      tags:
      - Audience
      summary: Agentic Audience Match
      description: 'Match a buyer-supplied agentic `AudienceRef` against this seller.


        Per proposal §5.7 + §6 row 11. Returns a match score and quality bucket.

        The score is mock-quality (deterministic from sha256 of `identifier`);

        the real embedding-similarity model is Epic 2 (E2-2).


        Behavior:

        - Non-agentic refs return HTTP 400.

        - Sellers with no top-level agentic capability (legacy / agentic

        decommissioned) return `agentic_supported_by_seller=False`,

        `match_quality="POOR"`, score 0.

        - Otherwise the score is deterministic per `identifier` and bucketed

        into `STRONG | MODERATE | WEAK | POOR`.'
      operationId: agentic_audience_match_agentic_audience_match_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgenticAudienceMatchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    AgenticAudienceMatchRequest:
      properties:
        audience_ref:
          additionalProperties: true
          type: object
          title: Audience Ref
        package_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Package Id
      type: object
      required:
      - audience_ref
      title: AgenticAudienceMatchRequest
      description: 'API request model for POST /agentic-audience/match (proposal §5.7).


        Accepts a single `AudienceRef` (must be `type=agentic`) and an optional

        package_id scope. Returns a deterministic mock-quality match score and

        quality bucket. Real model is Epic 2 / E2-2.'
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
x-refined-from:
- iab-tech-lab-seller-agent-openapi.json
- iab-tech-lab-seller-agent-openapi.json
